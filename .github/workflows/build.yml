name: Build FlowVeil

on:
  push:
    # Only main publishes a release. ui-* branches build Windows, bypass-* branches build both apps,
    # just to check the code. A push that changes nothing but the website builds nothing.
    branches: [main, 'ui-*', 'bypass-*']
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so releases are published in order.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/bypass-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Build libhev-socks5-tunnel
        run: |
          git clone https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
          git -C hev-socks5-tunnel checkout 64cc609f945253b0e9ebc56317d544268f3c68c1
          git -C hev-socks5-tunnel submodule update --init --recursive
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Download libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          curl -fL -o V2rayNG/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar

      - name: Add sing-box engine (TUIC)
        # Optional: without it the app still builds, TUIC servers just explain that the engine is missing.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import io, json, os, re, tarfile, time, urllib.request

          def fetch(url, api=False):
              headers = {"User-Agent": "flowveil-ci"}
              if api:
                  headers["Authorization"] = "Bearer " + os.environ["GH_TOKEN"]
              for attempt in range(5):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=120).read()
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(8 * (attempt + 1))

          # TUIC runs on sing-box 1.12-1.14 (the versions FlowVeil's config format targets).
          releases = json.loads(fetch("https://api.github.com/repos/SagerNet/sing-box/releases?per_page=40", api=True))
          rel = next(r for r in releases if not r["prerelease"] and re.fullmatch(r"v1\.1[2-4]\.\d+", r["tag_name"]))
          print("sing-box", rel["tag_name"])
          for abi, suffix in (("arm64-v8a", "android-arm64"),):
              asset = next((a for a in rel["assets"] if a["name"].endswith("-" + suffix + ".tar.gz") and "legacy" not in a["name"]), None)
              if asset is None:
                  print("::warning::no sing-box build for", abi)
                  continue
              data = fetch(asset["browser_download_url"])
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tar:
                  member = next(m for m in tar.getmembers() if m.isfile() and os.path.basename(m.name) == "sing-box")
                  out_dir = os.path.join("V2rayNG", "app", "libs", abi)
                  os.makedirs(out_dir, exist_ok=True)
                  out = os.path.join(out_dir, "libsingbox.so")
                  with open(out, "wb") as f:
                      f.write(tar.extractfile(member).read())
                  os.chmod(out, 0o755)
                  print(abi, os.path.getsize(out) // 1024 // 1024, "MB")
          PY

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HUPP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HUPP_KEYSTORE_PASSWORD }}
        run: |
          # A stable key (repo secrets) lets new builds install over old ones.
          # Without secrets a throwaway key is generated for this build only.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hupp.jks"
            echo "SIGN_PASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          else
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/hupp.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias hupp -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=FlowVeil"
            echo "SIGN_PASS=$PASS" >> $GITHUB_ENV
          fi

      - name: Build APK
        working-directory: android/V2rayNG
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreRelease -PhuppBuild=${{ github.run_number }} \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/hupp.jks" \
            -Pandroid.injected.signing.store.password="$SIGN_PASS" \
            -Pandroid.injected.signing.key.alias=hupp \
            -Pandroid.injected.signing.key.password="$SIGN_PASS"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/playstore/release/*universal*.apk "$GITHUB_WORKSPACE/out/FlowVeil-android.apk"
          cp app/build/outputs/apk/playstore/release/*arm64-v8a*.apk "$GITHUB_WORKSPACE/out/FlowVeil-android-arm64.apk"

      - name: Check bundled native engines
        continue-on-error: true
        run: |
          for apk in "$GITHUB_WORKSPACE"/out/*.apk; do
            echo "== $(basename "$apk")"
            unzip -l "$apk" | grep -E "libhevsockstun|libhev-socks5-tunnel|libgojni|libsingbox" || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx

      - name: Build FlowVeil
        run: |
          dotnet publish v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 -p:SelfContained=true -p:InformationalVersion=build-${{ github.run_number }} -o FlowVeil
          Rename-Item FlowVeil/v2rayN.exe FlowVeil.exe

      - name: Self-test (paste subscription link -> servers)
        continue-on-error: true
        run: |
          dotnet run --project selftest/HuppSelfTest/HuppSelfTest.csproj -c Release -- "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/windows/selftest"

      - name: Add Xray core
        run: |
          Invoke-WebRequest https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip -OutFile xray.zip -MaximumRetryCount 5 -RetryIntervalSec 10
          Expand-Archive xray.zip xray
          New-Item -ItemType Directory -Force FlowVeil/bin/xray | Out-Null
          Copy-Item xray/xray.exe FlowVeil/bin/xray/
          Copy-Item xray/*.dat FlowVeil/bin/

      - name: Add sing-box and wintun (TUN mode)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # sing-box runs the TUN device by default; FlowVeil supports sing-box up to 1.14.x.
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          # GitHub API occasionally times out: retry a few times before failing the build.
          for ($i = 1; $i -le 5; $i++) {
            try { $releases = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/SagerNet/sing-box/releases?per_page=40"; break }
            catch { if ($i -eq 5) { throw }; Start-Sleep -Seconds (10 * $i) }
          }
          $rel = $releases | Where-Object { -not $_.prerelease -and $_.tag_name -match '^v1\.(1[0-4])\.\d+$' } | Select-Object -First 1
          $ver = $rel.tag_name.TrimStart('v')
          Write-Host "sing-box $ver"
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$ver/sing-box-$ver-windows-amd64.zip" -OutFile singbox.zip -MaximumRetryCount 5 -RetryIntervalSec 10
          Expand-Archive singbox.zip singbox
          New-Item -ItemType Directory -Force FlowVeil/bin/sing_box | Out-Null
          Copy-Item singbox/*/* FlowVeil/bin/sing_box/ -Recurse -Force
          # Xray's own TUN needs wintun.dll next to xray.exe.
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip -MaximumRetryCount 5 -RetryIntervalSec 10
          Expand-Archive wintun.zip wintun
          Copy-Item wintun/wintun/bin/amd64/wintun.dll FlowVeil/bin/xray/

      - name: Add country flags
        # Windows cannot draw flag emoji; bundled PNGs work offline and right after start.
        continue-on-error: true
        shell: pwsh
        working-directory: windows
        run: |
          Invoke-WebRequest https://flagcdn.com/w80.zip -OutFile flags.zip -MaximumRetryCount 5 -RetryIntervalSec 10
          New-Item -ItemType Directory -Force FlowVeil/flags | Out-Null
          Expand-Archive flags.zip -DestinationPath FlowVeil/flags -Force
          Write-Host ("flags: " + (Get-ChildItem FlowVeil/flags -Filter *.png).Count)

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Q FlowVeil.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ../out | Out-Null
          Copy-Item FlowVeil-Setup.exe ../out/
          Compress-Archive FlowVeil/* ../out/FlowVeil-windows-portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*

  release:
    needs: [android, windows]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.android.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGES.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub lists releases by tag name, so "build-10" would sink below "build-2".
          # Zero-padded "v" tags sort correctly and always above the old "build-N" ones.
          TAG="v$(printf '%04d' ${{ github.run_number }})"
          cat > notes.md <<'EOF'
          **Какой файл скачать**

          | Устройство | Файл |
          |---|---|
          | Android (почти все телефоны) | `FlowVeil-android.apk` |
          | Android, только 64-бит (меньше размер) | `FlowVeil-android-arm64.apk` |
          | Windows — установщик | `FlowVeil-Setup.exe` |
          | Windows — без установки | `FlowVeil-windows-portable.zip` |

          Уже установлен FlowVeil? Обновитесь прямо в приложении: «Настройки → Проверить обновления».

          Добавить подписку: скопируйте ссылку на подписку от своего провайдера и нажмите «Вставить из буфера».
          Вопросы: Telegram [@GxoyzoomG](https://t.me/GxoyzoomG) · канал [FlowVeil](https://t.me/FlowVeil) · [Политика конфиденциальности](https://github.com/${{ github.repository }}/blob/main/PRIVACY.md)
          EOF
          sed -i 's/^          //' notes.md
          # What changed in this build goes first (kept up to date in CHANGES.md).
          if [ -s CHANGES.md ]; then
            { cat CHANGES.md; printf '\n---\n\n'; cat notes.md; } > notes-full.md && mv notes-full.md notes.md
          fi
          # GitHub sometimes answers 403/5xx for a moment: retry, and finish a half-created release.
          for attempt in 1 2 3 4; do
            if gh release create "$TAG" out/* --repo "${{ github.repository }}" \
                --target "${{ github.sha }}" --title "FlowVeil build-${{ github.run_number }}" --latest \
                --notes-file notes.md; then
              exit 0
            fi
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
              && gh release upload "$TAG" out/* --clobber --repo "${{ github.repository }}" \
              && gh release edit "$TAG" --latest --repo "${{ github.repository }}"; then
              exit 0
            fi
            echo "Publish attempt $attempt failed, retrying"
            sleep $((attempt * 20))
          done
          exit 1
